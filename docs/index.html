<title>Yoru Menú</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>/* Concepto: "ricing" anime en el celular. Fondo animado a pantalla completa y paneles de cristal con blur
   solo en los contenedores grandes (rendimiento); los botones pequeños son translúcidos sin filtro propio. */
:root{
  --h:338;--blur:14px;--ga:.5;--rad:18px;--fs:1;--dim:.1;--cols:2;
  --bg:#05060f;--fg:#eef1ff;--muted:#9aa6d3;--line:rgba(190,205,255,.16);
  --accent:hsl(var(--h) 100% 78%);--accent2:hsl(calc(var(--h) + 28) 95% 68%);
  --soft:hsl(var(--h) 100% 78% / .16);--aline:hsl(var(--h) 100% 78% / .45);
  --ok:#6df0b5;--warn:#ffd27a;--bad:#ff7d8d;--panel:rgba(12,16,42,var(--ga));--flat:rgba(255,255,255,.055);
  --font:'Sora',system-ui,sans-serif;--font-mono:'JetBrains Mono',ui-monospace,monospace;color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:400 14px/1.5 var(--font);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(104px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-2;display:block;background:var(--bg)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(4,5,14,calc(var(--dim) + .02)),rgba(4,5,14,calc(var(--dim) + .12)))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:600px;margin:0 auto;font-size:calc(14px*var(--fs));min-width:0}
.muted{color:var(--muted)}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.bf{-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
.noblur .bf{-webkit-backdrop-filter:none;backdrop-filter:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05);margin-bottom:12px}
.card h3.ch,.ch{margin:0 0 12px;font-size:1em;font-weight:700;display:flex;align-items:baseline;gap:8px}
.ch small,.sec-h small{font:400 .72em var(--font-mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.sec-h{margin:20px 2px 10px;font:600 .72em var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:baseline;gap:10px}
.eyebrow{font:500 .7em var(--font-mono);letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
/* superior */
.top{display:flex;align-items:center;gap:12px;padding-top:14px;margin-bottom:12px}
.logo{width:2.9em;height:2.9em;display:grid;place-items:center;flex:none;border-radius:calc(var(--rad)*.7);color:var(--accent)}
.logo svg{width:55%;height:55%}
.top h1{margin:0;font-size:1.2em;font-weight:800;line-height:1.1}
.top small{display:block;font:500 .72em var(--font-mono);letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.pill{margin-left:auto;display:flex;align-items:center;gap:6px;font:500 .8em var(--font-mono);color:var(--ok);background:rgba(109,240,181,.1);border:1px solid rgba(109,240,181,.3);padding:5px 10px;border-radius:99px;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 2.2s ease-in-out infinite}
.iconbtn{width:2.7em;height:2.7em;border-radius:50%;display:grid;place-items:center;flex:none;padding:0;transition:transform .4s cubic-bezier(.3,1.4,.5,1),border-color .2s}
.iconbtn svg{width:50%;height:50%}
.iconbtn:hover,.iconbtn:active{transform:rotate(70deg);border-color:var(--aline)}
/* vistas */
.view.in{animation:viewin .38s cubic-bezier(.2,.8,.2,1)}
/* inicio */
.hero{display:flex;flex-direction:column;gap:12px;padding:18px;background:linear-gradient(180deg,rgba(12,16,42,calc(var(--ga)*.18)),rgba(12,16,42,calc(var(--ga)*.55)));-webkit-backdrop-filter:blur(calc(var(--blur)*.35));backdrop-filter:blur(calc(var(--blur)*.35));position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,var(--aline),transparent 40%,transparent 60%,var(--aline));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.8}
.tag{align-self:flex-start;font:500 .68em var(--font-mono);letter-spacing:.22em;padding:5px 10px;border-radius:99px;background:var(--soft);border:1px solid var(--aline);color:var(--accent)}
.hero h2{margin:0;font-size:2.8em;font-weight:800;letter-spacing:-.02em;line-height:1;background:linear-gradient(100deg,#fff,var(--accent) 60%,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0}.hero .lead{color:#d4dbff;font-size:.92em;max-width:38ch}
.hero .row{display:grid;grid-template-columns:1.15fr 1fr;gap:12px;align-items:end}
.viz canvas{width:100%;height:56px;display:block}
.viz span{font:500 .7em var(--font-mono);color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.fetch{font:400 .8em/1.65 var(--font-mono);min-width:0}
.fetch b{color:var(--accent);font-weight:500;display:inline-block;min-width:4.6em}
.fetch .ex{display:block;color:var(--muted);font-size:.78em;letter-spacing:.1em;text-transform:uppercase}
.noviz .viz{display:none}.noviz .hero .row{grid-template-columns:1fr}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 8px;color:var(--accent);position:relative;overflow:hidden}
.stat span{color:var(--muted);font-size:.82em;grid-column:1/-1}
.stat b{color:var(--fg);font-size:1.45em;font-weight:700;line-height:1.1}
.stat em{font:500 .78em var(--font-mono);font-style:normal;color:var(--ok);align-self:end}
.stat svg{grid-column:1/-1;width:100%;height:28px;margin-top:4px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:calc(var(--rad)*.8);transition:transform .15s,border-color .2s}
.qa button:active{transform:scale(.94)}.qa button:hover{border-color:var(--aline)}
.qa i{font-style:normal;font-size:1.35em;color:var(--accent)}.qa span{font-size:.78em;color:var(--fg)}
.cod p{margin:8px 0 0}.cod .tip{font-size:.86em}
.cod-b{display:inline-flex;font-size:1.05em}
.news{display:grid;gap:10px}.news .card{margin:0}
.news h4{margin:2px 0 4px;font-size:1.02em}.news p{margin:0;color:#c9d2f5;font-size:.9em}
.ver{font:500 .72em var(--font-mono);color:var(--accent);border:1px solid var(--aline);padding:2px 8px;border-radius:99px}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.svc>div{display:flex;align-items:center;gap:10px;padding:11px 12px}
.svc i{width:8px;height:8px;border-radius:50%;flex:none}.svc i.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}.svc i.warn{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.svc b{display:block;font-size:.88em}.svc span{color:var(--muted);font-size:.78em}
/* comandos */
.search{display:flex;align-items:center;gap:10px;padding:0 14px;height:3.2em;margin-bottom:12px;transition:border-color .2s,box-shadow .2s}
.search svg{width:1.15em;height:1.15em;flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0}
.search input::placeholder{color:var(--muted)}
.search button{background:none;border:0;color:var(--muted);font-size:1.4em;line-height:1;padding:6px}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;margin-inline:-2px}
.scroller::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;padding:.6em 1.05em;border-radius:99px;color:var(--muted);font-weight:600;font-size:.86em;transition:color .2s,background .2s,border-color .2s,box-shadow .2s,transform .15s;white-space:nowrap}
.chip em{font:500 .8em var(--font-mono);font-style:normal;opacity:.8}
.chip:active{transform:scale(.94)}
.chip[aria-pressed=true]{color:var(--fg);border-color:var(--accent);background:var(--soft);box-shadow:0 0 18px var(--soft)}
.chip.sm{padding:.42em .9em;font-size:.78em}
.cathead{display:flex;align-items:center;gap:12px;margin:6px 2px 12px}
.cathead .ico{width:2.9em;height:2.9em;display:grid;place-items:center;font-size:1.25em;color:var(--accent);border-radius:calc(var(--rad)*.7)}
.cathead h3{margin:0;font-size:1.2em}.cathead p{margin:0;color:var(--muted);font-size:.86em}
.cathead .n{margin-left:auto;font:500 .8em var(--font-mono);color:var(--accent);border:1px solid var(--aline);padding:3px 10px;border-radius:99px}
.gridbox{padding:10px}
.grid{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:8px}
.cmd{display:flex;align-items:center;gap:8px;min-width:0;text-align:left;padding:.95em .9em;border-radius:calc(var(--rad)*.65);background:var(--flat);border:1px solid var(--line);font:500 .9em var(--font-mono);animation:rise .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*22ms);transition:transform .15s,border-color .2s,background .2s}
.compact .cmd{padding:.62em .8em}
.cmd:hover,.cmd:focus-visible{border-color:var(--aline);background:var(--soft);outline:0}
.cmd:active{transform:scale(.96)}
.cmd .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
.nodots .cmd .dot{display:none}
.cmd.adm .dot{background:var(--accent)}.cmd.own .dot{background:var(--warn)}.cmd.pre .dot{background:#c79bff}.cmd.ai .dot{background:#9bc0ff}
.cmd .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd .fav{color:var(--warn);font-size:.85em}
.cmd.more{grid-column:1/-1;justify-content:center;color:var(--accent)}
.cod-b{width:auto;display:inline-flex}
.empty{grid-column:1/-1;padding:28px 16px;text-align:center;color:var(--muted)}
.foot{text-align:center;color:var(--muted);font:400 .72em var(--font-mono);letter-spacing:.06em;padding-top:10px}
/* IA */
.models{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mdl{text-align:left;padding:12px;border-radius:calc(var(--rad)*.7);background:var(--flat);border:1px solid var(--line);transition:.2s}
.mdl b{display:block;font-size:.92em}.mdl span{display:block;color:var(--muted);font-size:.78em;margin-top:2px}
.mdl[aria-pressed=true],.pc[aria-pressed=true]{border-color:var(--accent);background:var(--soft);box-shadow:0 0 16px var(--soft)}
.quota{display:flex;justify-content:space-between;margin:14px 0 6px;font-size:.84em;color:var(--muted)}.quota b{color:var(--fg);font-family:var(--font-mono)}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.pers{padding-bottom:4px}.pc{flex:none;width:112px;padding:12px 10px;text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center;transition:.2s}
.pc i{font-style:normal;font-size:1.4em;color:var(--accent)}.pc b{font-size:.88em}.pc span{font-size:.72em;color:var(--muted)}
.chat-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.badge-demo{font:500 .68em var(--font-mono);letter-spacing:.08em;color:var(--warn);border:1px solid rgba(255,210,122,.4);padding:2px 8px;border-radius:99px;text-transform:uppercase}
.msgs{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto;padding:4px 2px;scroll-behavior:smooth}
.msg{max-width:84%;padding:9px 13px;border-radius:16px;line-height:1.4;animation:rise .3s both;overflow-wrap:anywhere}
.msg.b{align-self:flex-start;background:var(--flat);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.u{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1a0612;border-bottom-right-radius:5px;font-weight:500}
.typing{display:flex;gap:4px;padding:12px 14px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:dot 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.composer{display:flex;gap:8px;margin-top:10px}.composer input{flex:1;min-width:0;background:var(--flat);border:1px solid var(--line);border-radius:99px;padding:0 16px;height:44px;outline:0}
.composer input:focus{border-color:var(--accent)}
.btn{height:44px;padding:0 16px;border-radius:calc(var(--rad)*.7);border:1px solid var(--line);background:var(--flat);font-weight:600;font-size:.92em;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--fg);transition:transform .15s,border-color .2s}
.btn:active{transform:scale(.96)}.btn:disabled{opacity:.5}
.btn.main{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1a0612;border:0}
.btn.sm{height:38px;padding:0 14px}.btn.danger{width:100%;margin-top:10px;color:var(--bad);border-color:rgba(255,125,141,.4)}
.inp{width:100%;background:var(--flat);border:1px solid var(--line);border-radius:calc(var(--rad)*.6);padding:10px 12px;outline:0;resize:vertical}
.inp:focus{border-color:var(--accent)}
.lab{display:block;margin:10px 0 6px;color:var(--muted);font-size:.84em}
/* grupo */
.gh{display:flex;align-items:center;gap:14px}.gh h3{margin:0}.gh p{margin:0;font-size:.86em}.okc{color:var(--ok)}
.av{--g:0;width:2.8em;height:2.8em;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#12081c;flex:none;background:linear-gradient(135deg,hsl(calc(var(--h) + var(--g)*47) 95% 78%),hsl(calc(var(--h) + var(--g)*47 + 40) 90% 66%))}
.av.sm{width:2.2em;height:2.2em;font-size:.9em}.av.lg{width:4.4em;height:4.4em;font-size:1.4em;box-shadow:0 0 0 3px var(--soft),0 0 24px var(--soft)}
.trow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.trow:first-of-type{border-top:0;padding-top:0}.trow b{display:block;font-size:.92em}.trow span:not(.sw-t):not(.sw-t span){display:block;color:var(--muted);font-size:.78em}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.times label{font-size:.8em;color:var(--muted)}
.vars{display:flex;gap:8px;margin:10px 0}
.wa{background:rgba(0,0,0,.22);border-radius:14px;padding:12px}
.bub{background:#1f3a35;border-radius:12px 12px 12px 4px;padding:9px 12px;max-width:92%;white-space:pre-wrap;overflow-wrap:anywhere}
.mem{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.mem:first-of-type{border-top:0}
.mem b{display:block;font-size:.9em}.mem span{color:var(--muted);font-size:.78em}.mact{margin-left:auto;display:flex;gap:6px}
/* extras */
.ring{position:relative;width:170px;height:170px;margin:4px auto 16px}.ring svg{width:100%;height:100%}
.r0{fill:none;stroke:rgba(255,255,255,.1);stroke-width:7}.r1{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:600 2em var(--font-mono)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}.seg.c{display:flex;margin-bottom:14px}
.seg button{background:none;border:0;color:var(--muted);padding:8px 13px;font-weight:600;font-size:.85em;transition:.2s;flex:1}
.seg button[aria-pressed=true]{background:var(--soft);color:var(--fg)}
.btns3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.btns3.two{grid-template-columns:1fr 1fr}
.cdisp{background:rgba(0,0,0,.25);border-radius:14px;padding:16px;text-align:right;font:500 1.8em var(--font-mono);min-height:68px;overflow-wrap:anywhere;margin-bottom:10px}
.ckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.ckeys button{height:52px;border-radius:14px;background:var(--flat);border:1px solid var(--line);font:500 1.1em var(--font-mono);transition:transform .12s}
.ckeys button:active{transform:scale(.92)}.ckeys .op{background:var(--soft);color:var(--accent)}
.big{font:700 2em var(--font);text-align:center;padding:16px 0;color:var(--accent);overflow-wrap:anywhere}.big.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.pwd{font:500 1.05em var(--font-mono);background:rgba(0,0,0,.25);border-radius:12px;padding:14px;text-align:center;overflow-wrap:anywhere;margin-bottom:12px;min-height:50px}
.score{display:flex;justify-content:space-between;font:500 .85em var(--font-mono);color:var(--muted);margin-bottom:10px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:0 auto 10px}
.board button{aspect-ratio:1;border-radius:16px;background:var(--flat);border:1px solid var(--line);font-size:2.2em;font-weight:700;transition:.2s}
.board .X{color:var(--accent)}.board .O{color:#9bc0ff}
.c{text-align:center}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.mgrid button{aspect-ratio:1;border-radius:14px;background:var(--flat);border:1px solid var(--line);font-size:1.6em;color:var(--accent);transition:transform .25s,background .25s}
.mgrid button.on{background:var(--soft);border-color:var(--aline);transform:rotateY(0)}
.convr{display:grid;grid-template-columns:1.2fr 1fr auto 1fr;gap:8px;align-items:center}.arrow{color:var(--muted)}
/* perfil */
.ph{display:flex;align-items:center;gap:16px;margin-bottom:14px}.pn{display:flex;flex-direction:column;gap:4px;min-width:0}
.pn-i{font-weight:700;font-size:1.15em;padding:6px 10px;background:transparent;border-color:transparent}.pn-i:focus{background:var(--flat);border-color:var(--accent)}
.xp{height:10px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}.xp i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.xpl{display:flex;justify-content:space-between;font:400 .74em var(--font-mono);color:var(--muted);margin:6px 0 14px}
.pst{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.pst div{background:var(--flat);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}.pst b{display:block;font-size:1.2em}.pst span{font-size:.74em;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bd{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:12px 6px;border-radius:14px;background:var(--flat);border:1px solid var(--line);opacity:.5;filter:grayscale(1);transition:.4s}
.bd.on{opacity:1;filter:none;border-color:var(--aline);background:var(--soft)}.bd i{font-style:normal;font-size:1.5em;color:var(--accent)}.bd b{font-size:.78em}.bd span{font-size:.66em;color:var(--muted)}
.rk{display:grid;grid-template-columns:1.6em 5.5em 1fr auto;align-items:center;gap:10px;padding:7px 0;font-size:.88em}.rk em{font:600 .9em var(--font-mono);font-style:normal;color:var(--muted)}
.rk.me{color:var(--accent)}.rk span{font:400 .8em var(--font-mono);color:var(--muted)}.rk b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.inv>div{padding:12px 6px;text-align:center;display:flex;flex-direction:column;gap:2px;border-radius:14px}
.inv i{font-style:normal;font-size:1.4em;color:var(--accent)}.inv b{font-size:.78em}.inv span{font:400 .72em var(--font-mono);color:var(--muted)}
.cf{position:fixed;top:30%;width:8px;height:12px;border-radius:2px;z-index:60;pointer-events:none;animation:cf 1.5s cubic-bezier(.2,.6,.4,1) forwards}
/* dock */

draw(t){Z(.05);g.drawImage(base,0,0);let i=0;for(const o of orbs){Z(.12+.22*i++);addS(o.spr,W*o.x-o.s/2+Math.sin(t/7000+o.p)*W*.1,H*o.y-o.s/2+Math.cos(t/9000+o.p)*H*.08,o.s,o.s,1)}}}}

draw(t,dt){if(!bmp){g.fillStyle='#070a18';g.fillRect(0,0,W,H);return}

/* ───────── Gargantúa (WebGL) con respaldo 2D ───────── */
function hole(){

  const NSV=[118,92,66],GK=[1,.78,.58];
  return{usesHue:1,gl:true,
    init(){GLX.size(GK[lv])},

/* bokeh de primer plano (cada escena con su tono) */
const FBC={sakura:[null,90,82,.2],forest:[165,80,70,.18],summer:[52,100,90,.2],sunset:[30,100,72,.18],aurora:[170,90,70,.14],neon:[300,100,66,.16],rain:[200,60,76,.14],sea:[210,70,76,.12],stars:[220,60,80,.1]};
function mkFB(){const c=FBC[sid];fb=null;if(!c||!anim&&false)return;const r=rng(99),n=Math.round(5*dens*PART[lv]);if(!n)return;
  fb={spr:glow(96,c[0]===null?hue:c[0],c[1],c[2],1),a:c[3],p:Array.from({length:n},()=>({x:r()*W,y:r()*H,s:(60+r()*120)*u,v:.004+r()*.01,ph:r()*TAU,k:.6+r()*.8}))}}
function drawFB(t,dt){if(!fb)return;g.globalCompositeOperation='lighter';const o=ofs(1.7);
  for(const p of fb.p){p.y-=p.v*dt*u*.6;p.x+=Math.sin(t/3000+p.ph)*.01*dt*u;if(p.y<-p.s){p.y=H+p.s;p.x=Math.random()*W}
    g.globalAlpha=fb.a*(.5+.5*Math.sin(t/2300+p.ph))*p.k;g.drawImage(fb.spr,p.x+o[0]*p.k-p.s/2,p.y+o[1]*p.k-p.s/2,p.s,p.s)}
  g.globalAlpha=1;g.globalCompositeOperation='source-over'}

const SCENES={sakura,hole,aurora,neon,rain,sunset,summer,forest,stars:milky,sea,min:minimal,custom};

/* ───────── control ───────── */
function resizeNow(){const dpr=Math.min(devicePixelRatio||1,1.5),k=KS[lv]*dpr;
  W=cv.width=Math.max(2,Math.round(innerWidth*k));H=cv.height=Math.max(2,Math.round(innerHeight*k));u=W/390;lastW=innerWidth;lastH=innerHeight;cap=CAP[lv];build()}
function build(){sc=(SCENES[sid]||sakura)();shoot=[];GLX.show(false);g.setTransform(1,0,0,1,0,0);sc.init();if(sc.gl)GLX.show(true);mkFB();paint()}
function frame(t,dt){if(sc.gl){sc.draw(t,dt);return}sc.draw(t,dt);drawFB(t,dt);g.setTransform(1,0,0,1,0,0)}
function paint(){if(!anim||document.hidden){if(sc)frame(T,0)}}
function schedule(ms=140){clearTimeout(rb);rb=setTimeout(()=>{build();restart()},ms)}
function parStep(el,now){const q=now-lastIn>2600;if(q){tx*=Math.pow(.9992,el);ty*=Math.pow(.9992,el)}
  const ix=idle*Math.sin(T/6400)*.55,iy=idle*Math.cos(T/8700)*.32,k=1-Math.exp(-el/230);
  PX+=(Math.max(-1,Math.min(1,tx+ix))-PX)*k;PY+=(Math.max(-1,Math.min(1,ty+iy))-PY)*k}
function loop(ts){raf=requestAnimationFrame(loop);const el=ts-last;if(el<1000/cap-3)return;last=ts;if(el>200)return;
  parStep(Math.min(el,60),ts);const dt=Math.min(50,el)*speed;T+=dt;frame(T,dt);fsum+=el;fn++;
  if(fn>=45){const avg=fsum/fn;fps=Math.round(1000/avg);fsum=fn=0;if(qual==='auto'&&lv<2&&avg>(cap===60?23:40)){lv++;resizeNow()}}}
function restart(){cancelAnimationFrame(raf);raf=0;last=0;if(anim&&!document.hidden&&sc)raf=requestAnimationFrame(loop);else paint()}
addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(innerWidth!==lastW||Math.abs(innerHeight-lastH)>140){resizeNow();restart()}},180)});
document.addEventListener('visibilitychange',restart);
return{
  init(o){set(o,true)},
  set,setScene(id){sid=id;build();restart()},
  setCustom(b){bmp=b;if(sid==='custom'){build();restart()}},
  setPointer(x,y){tx=Math.max(-1,Math.min(1,x));ty=Math.max(-1,Math.min(1,y));lastIn=performance.now()},
  stats(){return{fps,lv,scale:KS[lv],gl:!!(sc&&sc.gl)}},
  get running(){return !!raf}
};
function set(o,first){first=first||!sc;
  if('hue' in o&&o.hue!==hue){hue=o.hue;if(!first&&sc&&sc.usesHue&&!sc.gl)schedule(180)}
  if('density' in o&&o.density!==dens){dens=o.density;if(!first&&sc&&!sc.gl)schedule(220)}
  if('speed' in o)speed=o.speed;
  if('par' in o)par=o.par;
  if('idle' in o)idle=o.idle;
  if('cpet' in o)cpet=o.cpet;
  if('anim' in o&&o.anim!==anim){anim=o.anim;if(!first)restart()}
  if('quality' in o&&o.quality!==qual){qual=o.quality;lv=qual==='low'?2:qual==='mid'?1:0;if(!first){resizeNow();restart()}else if(qual==='auto'&&((navigator.deviceMemory||8)<=3||(navigator.hardwareConcurrency||8)<=4))lv=1}
  if('scene' in o&&o.scene!==sid){sid=o.scene;if(!first){build();restart()}}
  if(first){resizeNow();restart()}
}
})();

function listCmds(){let l;
  if(query){const q=norm(query);l=CMDS.filter(c=>norm(c.name+' '+c.desc+' '+c.alias+' '+catOf(c.cat).name).includes(q))}
  else if(cat==='fav')l=CMDS.filter(c=>favs.has(c.name));else if(cat==='rec')l=recent.map(n=>CMDS.find(c=>c.name===n)).filter(Boolean);else l=CMDS.filter(c=>c.cat===cat);
  if(pf!=='all')l=l.filter(c=>c.perm===pf);if(sortAZ)l=[...l].sort((a,b)=>a.name.localeCompare(b.name));return l}
function renderCmds(){
  const all=[{id:'fav',name:'★ Favoritos',n:favs.size},{id:'rec',name:'↺ Recientes',n:recent.length},...CATS.map(c=>({id:c.id,name:c.name,n:CMDS.filter(x=>x.cat===c.id).length}))];

function stopPom(){clearInterval(pom.iv);pom.run=false}

 <div class="seg c">${[25,5,15].map(m=>`<button type="button" data-a="pmode" data-m="${m}" aria-pressed="${pom.m===m}">${m===25?'Enfoque':m===5?'Pausa':'Descanso'}</button>`).join('')}</div>

  const C=2*Math.PI*54,t=$('ptime');if(!t)return stopPom();t.textContent=pad(Math.floor(pom.left/60))+':'+pad(pom.left%60);$('pring').setAttribute('stroke-dashoffset',C*(pom.left/(pom.m*60)))}
function calcEval(){try{const e=calc.e.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-');if(!/^[0-9+\-*/().% ]+$/.test(e))return;const v=Function('"use strict";return ('+e+')')();if(!isFinite(v))throw 0;calc.e=String(Math.round(v*1e10)/1e10);bump('tool')}catch(x){calc.e='';toast('Operación no válida')}$('cd').textContent=calc.e||'0'}
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const winner=b=>{for(const l of LINES)if(b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[1]]===b[l[2]])return b[l[0]];return b.every(x=>x)?'D':null};
function minimax(b,pl){const w=winner(b);if(w==='O')return 1;if(w==='X')return -1;if(w==='D')return 0;let best=pl==='O'?-2:2;for(let i=0;i<9;i++)if(!b[i]){b[i]=pl;const v=minimax(b,pl==='O'?'X':'O');b[i]='';best=pl==='O'?Math.max(best,v):Math.min(best,v)}return best}
function botMove(){let bi=-1,bv=-2;for(let i=0;i<9;i++)if(!ttt.b[i]){ttt.b[i]='O';const v=minimax(ttt.b,'X');ttt.b[i]='';if(v>bv||(v===bv&&Math.random()<.3)){bv=v;bi=i}}if(bi>=0)ttt.b[bi]='O'}

function confetti(){const f=document.createDocumentFragment();for(let i=0;i<22;i++){const e=document.createElement('i');e.className='cf';e.style.cssText=`left:${10+Math.random()*80}%;--dx:${(Math.random()-.5)*160}px;--r:${Math.random()*720}deg;background:hsl(${S.hue+Math.random()*80-20} 100% ${65+Math.random()*20}%);animation-delay:${Math.random()*.2}s`;f.appendChild(e)}document.body.appendChild(f);setTimeout(()=>document.querySelectorAll('.cf').forEach(e=>e.remove()),1800)}

  else if(a==='rnd'){const w=b.dataset.w,o=$('rout');let v;if(w==='d6')v=1+Math.floor(Math.random()*6);else if(w==='d20')v=1+Math.floor(Math.random()*20);else if(w==='coin')v=Math.random()<.5?'Cara':'Cruz';else{const l=$('rlist').value.split('\n').map(x=>x.trim()).filter(Boolean);v=l.length?l[Math.floor(Math.random()*l.length)]:'—'}o.textContent=v;o.classList.remove('pop');void o.offsetWidth;o.classList.add('pop');bump('tool');buzz(15)}

  else if(a==='pcopy'){const t=$('pout').textContent;if(t!=='—'){navigator.clipboard.writeText(t).then(()=>toast('Copiado'),()=>toast('No se pudo copiar'))}}
  else if(a==='tc'){const i=+b.dataset.i;if(ttt.b[i]||winner(ttt.b))return;ttt.b[i]='X';let w=winner(ttt.b);if(!w){botMove();w=winner(ttt.b)}if(w==='X'){ttt.w++;addXp(10,10)}else if(w==='O')ttt.l++;else if(w==='D')ttt.d++;$('tool').innerHTML=tttHTML();buzz(10)}

  else if(a==='mreset'){memInit();$('tool').innerHTML=memHTML()}
  else if(a==='ctype'){cv={t:b.dataset.t,a:0,b:1,v:cv.v};$('tool').innerHTML=convHTML();convCalc()}
  else if(a==='daily'){const now=Date.now();PR.streak=(now-PR.last<48*36e5&&PR.last)?PR.streak+1:1;PR.last=now;const rw=100+PR.streak*20;addXp(30,rw);toast('+'+rw+' monedas · racha '+PR.streak);confetti();buzz([30,40,30,40,60]);renderMe()}
  else if(a==='goto'){go(b.dataset.t)}

  else if(a==='hue'){S.hue=+b.dataset.h;saveS();applyS()}

  else if(a==='cfav'){favs.clear();saveF();toast('Favoritos borrados');if(built.cmds)renderCmds()}else if(a==='crec'){recent=[];saveR();toast('Recientes borrados');if(built.cmds)renderCmds();updHome()}

/* ───────── visualizador (solo cuando se ve) ───────── */
let viz,vx,vgrad,vw=0,vh=0;
function vizInit(){viz=$('viz');if(!viz)return;vx=viz.getContext('2d');fitViz();new ResizeObserver(fitViz).observe(viz)}
function fitViz(){if(!viz)return;const r=viz.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);if(!r.width)return;vw=viz.width=Math.round(r.width*d);vh=viz.height=Math.round(r.height*d);vgrad=vx.createLinearGradient(0,0,0,vh);vgrad.addColorStop(0,`hsl(${S.hue} 100% 80%)`);vgrad.addColorStop(1,`hsla(${S.hue} 100% 75% / .2)`)}
let vlast=0;
function drawViz(ts){requestAnimationFrame(drawViz);if(!drawViz.on||tab!=='home'||!vx||!vw||ts-vlast<33)return;vlast=ts;vx.clearRect(0,0,vw,vh);vx.fillStyle=vgrad;vx.strokeStyle=vgrad;
  if(S.viz==='wave'){vx.lineWidth=2.2*(vh/56);vx.beginPath();for(let x=0;x<=vw;x+=4){const u=x/vw,y=vh/2+Math.sin(u*9+ts/300)*vh*.28*Math.sin(u*Math.PI)+Math.sin(u*21+ts/170)*vh*.08;x?vx.lineTo(x,y):vx.moveTo(x,y)}vx.stroke();return}
  const n=24,gap=vw/n,bw=gap*.6;for(let i=0;i<n;i++){const v=.5+.33*Math.sin(ts/420+i*.7)*Math.cos(ts/900+i*.31)+.12*Math.sin(ts/160+i*1.9),h=Math.max(4,Math.min(1,v)*vh*.95);vx.fillRect(i*gap+(gap-bw)/2,vh-h,bw,h)}}
drawViz.on=false;

/* ───────── arranque ───────── */
(function boot(){
  const nav=$('dock');nav.innerHTML='<i id="dock-i"></i>'+TABS.map(t=>`<button type="button" data-t="${t[0]}" aria-label="${t[1]}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${t[2]}"/></svg><span>${t[1]}</span></button>`).join('');
  buildSettings();applyS();
  const h=new Date().getHours();if(h<5)PR.owl=1;
  const t0=Object.keys(HASH).find(k=>HASH[k]===location.hash.slice(1))||'home';go(t0,true);
  requestAnimationFrame(drawViz);
  /* entrada del parallax: puntero/táctil, giroscopio y scroll */
  const nx=e=>(e.clientX/innerWidth-.5)*2,ny=e=>(e.clientY/innerHeight-.5)*2;
  addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)BG.setPointer(nx(e),ny(e))},{passive:true});
  addEventListener('touchmove',e=>{const t=e.touches[0];if(t)BG.setPointer(nx(t),ny(t))},{passive:true});
  let gOn=false;const gy=e=>{if(!S.gyro||e.gamma==null)return;BG.setPointer(Math.max(-1,Math.min(1,e.gamma/28)),Math.max(-1,Math.min(1,(e.beta-45)/28)))};
  const gyroStart=()=>{if(gOn||typeof DeviceOrientationEvent==='undefined')return;
    const go=()=>{gOn=true;addEventListener('deviceorientation',gy,{passive:true})};
    if(typeof DeviceOrientationEvent.requestPermission==='function'){DeviceOrientationEvent.requestPermission().then(r=>{if(r==='granted')go()}).catch(()=>{})}else go()};
  addEventListener('pointerdown',()=>{if(S.gyro)gyroStart()},{once:true,passive:true});
  if(S.scene==='custom'||PR.custom)IDB.get('bg').then(b=>{if(b)useBlob(b)});
  checkAch()})();
</script>
