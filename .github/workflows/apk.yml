name: Compilar APK
on:
  push:
    branches: [main]
    paths: ['src/**', 'android/**', 'package.json', 'scripts/prepare-android.js', '.github/workflows/apk.yml']
  workflow_dispatch:
  release:
    types: [published]
permissions: { contents: write }
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Tests del bot
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Regenerar menú y lista de comandos
        run: node scripts/build-menu.js
      - name: Preparar el bot que va dentro de la app
        run: node scripts/prepare-android.js
      - name: Proyecto Android (Capacitor)
        working-directory: android
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          python3 - <<'PY'
          import re
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          perms=['WAKE_LOCK','FOREGROUND_SERVICE','POST_NOTIFICATIONS','REQUEST_IGNORE_BATTERY_OPTIMIZATIONS']
          add=''.join('<uses-permission android:name="android.permission.%s" />\n    '%x for x in perms if x not in s)
          s=s.replace('<application',add+'<application',1)
          open(p,'w').write(s)
          PY
          npx cap sync android
      - name: Compilar APK
        working-directory: android/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Renombrar
        run: cp android/android/app/build/outputs/apk/debug/app-debug.apk yoru.apk
      - uses: actions/upload-artifact@v4
        with: { name: yoru-apk, path: yoru.apk }
      - name: Adjuntar a la release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" yoru.apk --clobber
        env: { GH_TOKEN: '${{ github.token }}' }
