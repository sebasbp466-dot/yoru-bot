  <main id="views">
    <div class="view" id="v-home" hidden></div><div class="view" id="v-cmds" hidden></div><div class="view" id="v-ia" hidden></div>
    <div class="view" id="v-group" hidden></div><div class="view" id="v-extras" hidden></div><div class="view" id="v-me" hidden></div>

</div>
<nav id="dock" aria-label="Secciones"></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-name" aria-hidden="true">
  <div class="card bf">
    <div class="grab"></div>
    <header class="sh"><div><h4 id="sh-name"></h4><small id="sh-cat"></small></div><button class="x" id="sh-x" type="button" aria-label="Cerrar">×</button></header>
    <p class="desc" id="sh-desc"></p>
    <dl class="meta"><dt>Ejemplo</dt><dd id="sh-ex"></dd><dt>Permiso</dt><dd id="sh-perm"></dd><dt>Alias</dt><dd id="sh-al"></dd></dl>
    <div class="eyebrow">Relacionados</div><div class="rel" id="sh-rel"></div>
    <div class="btns">
      <button class="btn main" id="sh-copy" type="button">Copiar comando</button>
      <a class="btn" id="sh-try" href="#" target="_blank" rel="noopener">Probar</a>
      <button class="btn" id="sh-fav" type="button">☆ Favorito</button>
      <button class="btn" id="sh-close" type="button">Cerrar</button>
    </div>
  </div>
</div>
<div class="sheet" id="set" role="dialog" aria-modal="true" aria-label="Personalizar" aria-hidden="true"><div class="card bf" id="set-c"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
